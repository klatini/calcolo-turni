<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcolo Ore Turni Ospedale</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 10px;
    }

    .container {
        max-width: 500px;
        margin: 20px auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        color: #2c3e50;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    .result {
        margin-top: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #2c3e50;
    }

    .note {
        font-size: 14px;
        color: #666;
        margin-top: 10px;
        text-align: center;
    }
</style>

</head>

<body>

<div class="container">

    <h2>Calcolo Ore Lavorate</h2>

    <form onsubmit="calcola(); return false;">

        <label>Mattina m – Turni 7:00-14:00</label>
        <input type="number" id="m" min="0" value="0">

        <label>Mattina C – Turni 8:00 - 14:00</label>
        <input type="number" id="C" min="0" value="0">

        <label>Pomeriggio H – Turni 14:00 - 20:00</label>
        <input type="number" id="H" min="0" value="0">

        <label>Pomeriggio 2 - Turni 14:00 - 22:00</label>
        <input type="number" id="due" min="0" value="0">

        <label>Notte 3 - Turni 22:00 - 7:00</label>
        <input type="number" id="tre" min="0" value="0">

        <button type="submit">CALCOLA</button>

    </form>

    <div class="result">
        Totale ore: <span id="risultato">0</span>
    </div>

    <div class="note">
        Inserire solo numeri interi positivi
    </div>

</div>

<script>
function calcola() {

    const ore_m = 7;
    const ore_C = 6;
    const ore_H = 6;
    const ore_due = 8;
    const ore_notte = 9;

    let m = parseInt(document.getElementById("m").value) || 0;
    let C = parseInt(document.getElementById("C").value) || 0;
    let H = parseInt(document.getElementById("H").value) || 0;
    let due = parseInt(document.getElementById("due").value) || 0;
    let notte = parseInt(document.getElementById("tre").value) || 0;

    let ore_lavorate_m = m * ore_m;
    let ore_lavorate_C = C * ore_C;
    let ore_lavorate_H = H * ore_H;
    let ore_lavorate_due = due * ore_due;
    let ore_lavorate_notte = notte * ore_notte;

    // QUI INSERIRAI TU LA FORMULA REALE
    let totale = ore_lavorate_m + ore_lavorate_C + ore_lavorate_H + ore_lavorate_due + ore_lavorate_notte;

    document.getElementById("risultato").innerText = totale;
}
</script>

</body>
</html>
